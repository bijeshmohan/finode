# Install once with:  make hooks
# Run on everything:  uv run --project backend pre-commit run --all-files
# ruff and pyrefly come from the API's own lock file (backend/uv.lock), so the hooks and CI always agree.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^docs/guide/img/
      - id: end-of-file-fixer
        exclude: ^(docs/guide/img/|frontend/src/styles/fonts/)
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=600]
      - id: detect-private-key

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        # From backend/, so ruff reads backend/pyproject.toml with its paths (the file names lose their backend/ prefix).
        entry: bash -c 'cd backend && uv run ruff check --fix "${@#backend/}"' --
        language: system
        types: [python]
        files: ^backend/
      - id: ruff-format
        name: ruff format
        entry: bash -c 'cd backend && uv run ruff format "${@#backend/}"' --
        language: system
        types: [python]
        files: ^backend/
      - id: pyrefly
        name: pyrefly
        entry: bash -c 'cd backend && uv run pyrefly check'
        language: system
        types: [python]
        files: ^backend/
        pass_filenames: false
      - id: frontend-lint
        name: frontend lint (eslint, prettier)
        entry: npm --prefix frontend run lint
        language: system
        files: ^frontend/
        pass_filenames: false
