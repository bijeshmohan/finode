# finode behind the existing Traefik reverse proxy.
#
# Reads .env for both the app (FINODE_*) and the deployment settings below:
#   APP_DOMAIN           finode's public host name, e.g. finode.example.com (required): the app and the API share it,
#                        Traefik sending /api, /mcp and /.well-known to `app` and every other path to `web`
#   TRAEFIK_NETWORK      external network Traefik watches (default: proxy)
#   TRAEFIK_ENTRYPOINT   HTTPS entrypoint (default: websecure)
#   TRAEFIK_CERTRESOLVER ACME resolver (default: le)
#   WEB_CONCURRENCY      uvicorn workers (default: 2)
#   BACKUP_PATH          host folder for nightly database dumps (default: ./backups)
#   BACKUP_UID, BACKUP_GID  owner of the dump files (default 1000:1000; use `id -u`)
#   BACKUP_KEEP_DAYS, BACKUP_HOUR   how long to keep dumps (14) and when (02 UTC)

name: finode

x-finode: &finode
  image: finode:latest
  build:
    context: backend
  env_file: .env

services:
  migrate:
    <<: *finode
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    networks: [default]

  app:
    <<: *finode
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    environment:
      FINODE_COOKIE_SECURE: "true"
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
      # Only Traefik can reach the app (no published ports), so trust its
      # X-Forwarded-* headers for the original scheme and client address.
      FORWARDED_ALLOW_IPS: "*"
    networks: [proxy]
    labels:
      traefik.enable: "true"
      traefik.docker.network: ${TRAEFIK_NETWORK:-proxy}
      # The API's own paths only; every other path on the address is the app's (the `web` router below).
      traefik.http.routers.finode.rule: >-
        Host(`${APP_DOMAIN:?set APP_DOMAIN in .env}`) && (PathPrefix(`/api/`) || Path(`/api`) || Path(`/mcp`) ||
        PathPrefix(`/mcp/`) || PathPrefix(`/.well-known/`) || Path(`/docs`) || Path(`/redoc`) || Path(`/openapi.json`))
      traefik.http.routers.finode.priority: "100"
      traefik.http.routers.finode.entrypoints: ${TRAEFIK_ENTRYPOINT:-websecure}
      traefik.http.routers.finode.tls: "true"
      traefik.http.routers.finode.tls.certresolver: ${TRAEFIK_CERTRESOLVER:-le}
      traefik.http.services.finode.loadbalancer.server.port: "8000"

  # The finode app (frontend/Dockerfile): static files only, no settings and no secrets, on the same address as the API.
  web:
    image: finode-web:latest
    build:
      context: frontend
    restart: unless-stopped
    # Static files only: nothing to write but nginx's own scratch space, no Linux capabilities, no way to gain any.
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [proxy]
    labels:
      traefik.enable: "true"
      traefik.docker.network: ${TRAEFIK_NETWORK:-proxy}
      traefik.http.routers.finode-web.rule: Host(`${APP_DOMAIN:?set APP_DOMAIN in .env}`)
      traefik.http.routers.finode-web.priority: "1"
      traefik.http.routers.finode-web.entrypoints: ${TRAEFIK_ENTRYPOINT:-websecure}
      traefik.http.routers.finode-web.tls: "true"
      traefik.http.routers.finode-web.tls.certresolver: ${TRAEFIK_CERTRESOLVER:-le}
      traefik.http.services.finode-web.loadbalancer.server.port: "8080"

  # Nightly dump of the database into ./backups (kept BACKUP_KEEP_DAYS days,
  # default 14). Restore notes: README, "Backups".
  backup:
    image: postgres:17-alpine
    env_file: .env
    restart: unless-stopped
    user: "${BACKUP_UID:-1000}:${BACKUP_GID:-1000}"
    entrypoint: ["/bin/sh", "/backup.sh"]
    environment:
      BACKUP_DIR: /backups
    volumes:
      - ./scripts/db-backup.sh:/backup.sh:ro
      - ${BACKUP_PATH:-./backups}:/backups
    networks: [default]

networks:
  proxy:
    name: ${TRAEFIK_NETWORK:-proxy}
    external: true
