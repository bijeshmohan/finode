<div class="row {{ 'root' if node.kind == 'root' }}" id="account-row-{{ node.account.aid }}">
  <span class="name">
    <a class="plain" href="/app/accounts/{{ node.account.aid }}/register">{{ node.account.name }}</a>
    {% if node.kind == "system" %}<span class="badge">system</span>{% endif %}
    {% if node.account.details and node.kind != "root" %}<small class="muted">{{ node.account.details }}</small>{% endif %}
  </span>
  <span class="amount">{{ node.account.balance|money }}</span>
  <span class="row-actions">
    {% if node.kind == "user" %}
    <button class="secondary"
            hx-get="/app/accounts/{{ node.account.aid }}/edit"
            hx-target="#account-row-{{ node.account.aid }}"
            hx-swap="outerHTML">Edit</button>
    <button class="danger"
            hx-post="/app/accounts/{{ node.account.aid }}/delete"
            hx-confirm="Delete account '{{ node.account.name }}'?">Delete</button>
    {% endif %}
  </span>
</div>
