{#- <option>s for an account picker, grouped by account type. `groups` comes from posting_groups(). -#}
{% macro account_options(groups, selected=None, allow_new=False) -%}
  <option value="">Choose account…</option>
  {% if allow_new %}<option value="__new__">+ New account…</option>{% endif %}
  {% for root, nodes in groups %}
  <optgroup label="{{ root }}">
    {% for n in nodes %}<option value="{{ n.account.aid }}" data-budget="{{ 1 if n.account.on_budget else 0 }}"{% if n.account.payment_category_id %} data-usual="{{ n.account.payment_category_id }}"{% endif %} {{ "selected" if n.account.aid == selected }}>{{ n.path.split(" › ", 1)[1] if " › " in n.path else n.path }}</option>{% endfor %}
  </optgroup>
  {% endfor %}
{%- endmacro %}

{#- <option>s for the category a payment into a loan or fund is labelled with: the spending categories (the Expenses part of `groups`). -#}
{% macro category_options(groups, selected=None) -%}
  <option value="">No category</option>
  {% for root, nodes in groups if root == "Expenses" %}
    {% for n in nodes %}<option value="{{ n.account.aid }}" {{ "selected" if n.account.aid == selected }}>{{ n.path.split(" › ", 1)[1] if " › " in n.path else n.path }}</option>{% endfor %}
  {% endfor %}
{%- endmacro %}
