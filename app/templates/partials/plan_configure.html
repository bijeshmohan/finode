{#- The sheet behind the sliders button: which sections the Plan has and which accounts are in Build. Expects build_on, earn_on, month_key, tab. -#}
<div class="sheet-grab" aria-hidden="true"></div>
<div class="sheet-title">
  <div>
    <h2>Your plan</h2>
    <p class="muted">Pick the sections you use. Hidden ones keep their amounts.</p>
  </div>
</div>
<form class="stack" hx-post="/plan/configure" hx-swap="none" hx-sync="this:replace">
  <input type="hidden" name="month" value="{{ month_key }}">
  <input type="hidden" name="tab" value="{{ tab }}">
  <div class="cfg">
    <div class="cfg-row">
      <span><b>Spend</b><small class="muted">Budget for what you spend · always on</small></span>
      <input type="checkbox" class="toggle" checked disabled aria-label="Spend, always on">
    </div>
    <label class="cfg-row">
      <span><b>Build</b><small class="muted">Funds, deposits and loan paydown · pick the accounts on their own pages</small></span>
      <input type="checkbox" class="toggle" name="build" value="1" {{ "checked" if build_on }}>
    </label>
    <label class="cfg-row">
      <span><b>Earn</b><small class="muted">What you expect to earn each month</small></span>
      <input type="checkbox" class="toggle" name="earn" value="1" {{ "checked" if earn_on }}>
    </label>
  </div>
  <p id="plan-sheet-error" class="error" role="alert"></p>
  <div class="sheet-actions">
    <button type="submit">Done</button>
  </div>
</form>
