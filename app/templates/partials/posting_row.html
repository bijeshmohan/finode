<div class="posting-row">
  <select name="account" aria-label="Account">
    <option value="">Select account</option>
    {% for root, nodes in groups %}
    <optgroup label="{{ root }}">
      {% for n in nodes %}
      <option value="{{ n.account.aid }}" {{ "selected" if posting and posting.account == n.account.aid }}>{{ n.path }}</option>
      {% endfor %}
    </optgroup>
    {% endfor %}
  </select>
  <select name="side" aria-label="Side">
    <option value="debit" {{ "selected" if posting and posting.side.value == "debit" }}>Debit</option>
    <option value="credit" {{ "selected" if posting and posting.side.value == "credit" }}>Credit</option>
  </select>
  <input type="text" name="amount" inputmode="decimal" placeholder="0.00" aria-label="Amount"
         value="{{ posting.amount if posting else '' }}">
  <button type="button" class="secondary" data-remove-row aria-label="Remove row">×</button>
</div>
