{% from "partials/account_options.html" import account_options %}
<div class="posting-row">
  <select name="account" aria-label="Account" data-account-select>
    {{ account_options(groups, posting.account if posting else None, allow_new=True) }}
  </select>
  <select name="side" aria-label="Side">
    <option value="debit" {{ "selected" if posting and posting.side.value == "debit" }}>Debit</option>
    <option value="credit" {{ "selected" if (posting and posting.side.value == "credit") or (not posting and default_side == "credit") }}>Credit</option>
  </select>
  <input type="text" name="amount" inputmode="decimal" placeholder="0.00" aria-label="Amount"
         value="{{ posting.amount if posting else '' }}">
  <button type="button" class="secondary" data-remove-row aria-label="Remove row">×</button>
</div>
