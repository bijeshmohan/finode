{#- The one sheet that picks an account or a category: the Add and recurring forms' rows and the Under field of the account and category forms. -#}
<dialog id="row-picker" class="sheet sheet-bottom" aria-label="Category">
  <div class="sheet-body">
    <div class="sheet-grab" aria-hidden="true"></div>
    <h2 class="filter-title" tabindex="-1" autofocus>Category</h2>
    <input type="search" class="filter-search" placeholder="Search categories" aria-label="Search categories" autocomplete="off" data-pick-search>
    <ul class="filter-options" data-pick-list></ul>
  </div>
</dialog>
