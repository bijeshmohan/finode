{#- One side of a transaction: an account and what it gets. `side` is credit (From) or debit (To). -#}
{% from "partials/account_options.html" import account_options %}
<div class="txn-row" data-row {{ "data-touched" if posting }}>
  <input type="hidden" name="side" value="{{ side }}">
  <select name="account" aria-label="Account" data-account-select>
    {{ account_options(groups, (posting.account if posting else selected), allow_new=True) }}
  </select>
  <input type="text" name="amount" class="row-amount" inputmode="decimal" placeholder="0.00" autocomplete="off"
         aria-label="Amount" value="{{ posting.amount if posting else '' }}">
  <button type="button" class="icon-button" data-remove-row title="Remove" aria-label="Remove">×</button>
</div>
