{% extends "base.html" %}
{% block title %}Create account · finode{% endblock %}
{% block header %}{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>finode</h1>
  <p class="muted">Create an account. You need an invite code.</p>
  {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="/app/signup" class="stack">
    <label>Email
      <input type="email" name="email" value="{{ email }}" autocomplete="username" required autofocus>
    </label>
    <label>Password
      <input type="password" name="password" autocomplete="new-password" minlength="8" required>
    </label>
    <label>Confirm password
      <input type="password" name="confirm_password" autocomplete="new-password" minlength="8" required>
    </label>
    <label>Invite code
      <input type="password" name="invite_code" autocomplete="off" required>
    </label>
    <button type="submit">Create account</button>
  </form>
  <p class="muted switch">Already have an account? <a href="/app/login">Sign in</a></p>
</section>
{% endblock %}
