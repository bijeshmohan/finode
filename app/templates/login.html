{% extends "base.html" %}
{% block title %}Sign in · finode{% endblock %}
{% block body_class %}bare{% endblock %}
{% block header %}{% endblock %}
{% block tabbar %}{% endblock %}
{% block content %}
<section class="card narrow">
  <h1 class="brand-title"><img src="{{ asset_url('favicon.svg') }}" alt="" width="36" height="36">finode</h1>
  <p class="muted">Sign in to your ledger.</p>
  {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="/app/login" class="stack">
    <label>Email
      <input type="email" name="email" value="{{ email }}" autocomplete="username" required autofocus>
    </label>
    <label>Password
      <input type="password" name="password" autocomplete="current-password" required>
    </label>
    <button type="submit">Sign in</button>
  </form>
</section>
{% endblock %}
