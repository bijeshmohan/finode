# The React app (frontend/Dockerfile). Every app address answers the app's page, which the app routes itself; a file
# under /assets is there or it is a 404, never the page, so a tab open across a redeploy that asks for an old script
# gets an error it can recover from rather than HTML run as a script. The page, the service worker and the manifest
# are asked for again each time, so a redeploy reaches people; the hashed files never change and are kept a year.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

    location /assets/ {
        try_files $uri =404;
        include /etc/nginx/finode-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # A script at the top (sw.js, workbox-<hash>.js) is there or it is a 404, never the page, as under /assets; asked
    # for again each time, so a new service worker is found.
    location ~ ^/[^/]+\.js$ {
        try_files $uri =404;
        include /etc/nginx/finode-headers.conf;
        add_header Cache-Control "no-cache";
    }

    location = /manifest.webmanifest {
        types { application/manifest+json webmanifest; }
        include /etc/nginx/finode-headers.conf;
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri /index.html;
        include /etc/nginx/finode-headers.conf;
        add_header Cache-Control "no-cache";
    }
}
