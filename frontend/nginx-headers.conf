# On every answer, errors included (`always`): nginx's own add_header in a location replaces the server's, so each
# location includes this.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "same-origin" always;
# No other site may show the app inside a frame (clickjacking); the old header for old browsers, the current one too.
add_header X-Frame-Options "DENY" always;
add_header Content-Security-Policy "frame-ancestors 'none'" always;
