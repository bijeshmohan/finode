[project]
name = "finode"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.18.4",
    "fastapi[standard]>=0.136.1",
    "mcp>=2.3.0",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.14.0",
    "pyjwt[crypto]>=2.10.1",
    "sqlmodel>=0.0.38",
]

[tool.fastapi]
entrypoint = "app.main:app"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
